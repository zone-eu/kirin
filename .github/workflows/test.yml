name: Run tests

on:
    push:
    pull_request:

jobs:
    test:
        timeout-minutes: 10
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run check

    package:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm

            - run: npm ci
            - name: Verify npm package contents
              run: npm pack --dry-run

    docker:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Build image
              run: docker build -t kirin:test .
            - name: Smoke-test compiled entrypoint
              run: docker run --rm kirin:test npm run show-config
