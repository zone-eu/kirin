name: Run tests

on:
    push:
    pull_request:

jobs:
    test:
        timeout-minutes: 10
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run check
